# nginx site for the PaulusAI web UI (served by paulus-gateway on WEB_PORT).
#
# Install:
#   sudo cp deploy/nginx-paulus-web.conf /etc/nginx/sites-available/paulus-web
#   sudo ln -s /etc/nginx/sites-available/paulus-web /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d paulus.example.com      # adds the TLS server block
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then in /etc/paulus/paulus.env:
#   WEB_PORT=8080
#   WEB_PUBLIC_URL=https://paulus.example.com
# and link the domain to the bot once: @BotFather -> /setdomain.

server {
    listen 80;
    server_name paulus.example.com;

    # Uploads (images, text documents) travel over the WebSocket, but keep
    # ordinary requests bounded too.
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # Logins and sockets are checked against this Host (or WEB_PUBLIC_URL).
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WebSocket upgrade for /ws.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # A turn can wait minutes on an approval; the socket pings every 30 s.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

